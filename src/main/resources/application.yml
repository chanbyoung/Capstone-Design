spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/dorikkiri?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_ROOT_PASSWORD}
  jpa:
    hibernate:
       ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
        # show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: smtp.naver.com
    port: 587
    username: pcb7893@naver.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        starttls:
          enable: true
          auth: true
          ssl:
            enable:
              true:
  mvc:
    static-path-pattern: /images/**

logging.level:
  org.hibernate.SQL: debug
#  org.springframework.web: TRACE

file:
  dir: ${FILE_DIR}

jwt:
  secret: ${JWT_SECRET}

host:
  name : ${HOST_NAME}