services:
  mysql:
    image: mysql:8.3.0
    networks:
      - service
    expose:
      - 3306
    volumes:
      - mysql-volume-project:/var/lib/mysql
      - ./init/init.sql:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dorikkiri
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M

  redis:
    image: redis:latest
    networks:
      - service

  was:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - service
    restart: always
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.2'
          memory: 512M
    depends_on:
      - mysql
      - redis
    env_file:
      - .env.prod
    expose:
      - 8080

networks:
  service:

volumes:
  mysql-volume-project:
